<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#0b0a17">
    <meta name="description" content="Varconstint is Henry, an indie developer and creator of STEMSTAGE, the rhythm game that plays any song.">
    <title>Varconstint — Henry, indie developer</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="site-shell">
      <header class="site-header">
        <a class="site-name" href="./" aria-label="Varconstint, home">varconstint<span aria-hidden="true">.</span></a>
      </header>

      <main>
        <section class="profile-card" aria-labelledby="intro-title">
          <div class="profile-banner" aria-hidden="true">
            <canvas id="banner-scene"></canvas>
            <span class="banner-glyph">v.</span>
          </div>

          <div class="hero-main">
            <div class="hero-copy">
              <p class="username">@varconstint</p>
              <h1 id="intro-title">Hey, I'm <span>Henry.</span></h1>
              <p class="hero-lead">I'm an indie developer who made STEMSTAGE.</p>
              <p class="hero-detail">I sometimes use Claude and ChatGPT for help.</p>
              <div class="hero-actions">
                <a class="primary-link" href="https://stemstage.varconstint.com/">
                  Visit STEMSTAGE
                  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 19 19 5M8 5h11v11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </a>
              </div>
            </div>

            <div class="hero-visual">
              <div class="avatar-orbit" aria-hidden="true"></div>
              <div class="avatar-frame">
                <img class="avatar" src="./assets/profile.png" alt="Varconstint's profile picture: a person with a computer monitor head" width="1254" height="1254">
              </div>
            </div>
          </div>
        </section>

        <section class="project-section" id="stemstage" aria-labelledby="project-title">
          <h2 class="visually-hidden" id="project-title">STEMSTAGE</h2>

          <a class="project-card" href="https://stemstage.varconstint.com/" aria-label="Visit STEMSTAGE, the rhythm game that plays any song">
            <span class="project-art">
              <img src="./assets/stemstage-logo.png" alt="STEMSTAGE" width="1360" height="290">
            </span>
            <span class="project-body">
              <span class="project-copy">
                <span class="project-headline">The rhythm game that plays any song.</span>
                <span class="project-action">Visit STEMSTAGE
                  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 19 19 5M8 5h11v11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </span>
              </span>
              <span class="gameplay-frame">
                <img src="./assets/stemstage-gameplay.png" alt="STEMSTAGE gameplay showing a note highway on a concert stage" loading="lazy" width="1600" height="900">
              </span>
            </span>
          </a>
        </section>
      </main>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
